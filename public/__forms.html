<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Race alerts registration</title>
  </head>
  <body>
    <form
      name="race-alerts"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="race-alerts" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="team" />
      <input name="bot-field" />
    </form>
  </body>
</html>
